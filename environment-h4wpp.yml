# Optional extraction environment for the repository's Hand4Whole++ backend.
# Keep this separate from environment.yml: H4W++ requires pytorch3d and the
# OpenMMLab stack, while the core re-id trainer remains lightweight.
name: reid_h4wpp
channels:
  - pytorch
  - nvidia
  - conda-forge
dependencies:
  - python=3.10
  - pytorch=2.1.0
  - torchvision=0.16.0
  - pytorch-cuda=11.8
  - pip
  - pip:
      - numpy==1.26.4
      - scipy==1.15.3
      - opencv-python==4.13.0.92
      - pillow==12.2.0
      - pyyaml==6.0.3
      - yacs==0.1.8
      - chumpy==0.70
      - smplx==0.1.28
      - pytorch3d==0.7.5
      - ultralytics==8.3.101
      - mmcv==2.1.0
      - mmengine==0.10.7
      - mmpose==1.3.2
      - timm==1.0.15
      - einops==0.8.1
      - trimesh==4.12.2
      - pyrender==0.1.45
