project: totalcapture_synthetic_imu_20260506

preprocess:
  dataset: totalcapture
  imu_source: synthetic
  synthetic_imu_root: /data/fzliang/datasets/totalcapture_synthetic_imu/preprocess/sequences
  synthetic_imu_side: right
  raw_root: /data/fzliang/totalcapture
  camera: cam1
  skeleton_normalize: false

extract:
  copy_from: /data/fzliang/reid-project/totalcapture/skeleton/alphapose
  skip_existing: true

slice:
  window_len: 24
  stride: 16
  sensor_order: [L_LowLeg, R_LowLeg, L_LowArm, R_LowArm]
  train_subjects: S1,S2,S3
  val_subjects: S4
  test_subjects: S5
  max_sequences: 0
  skeleton_source: alphapose
  skeleton_normalize: true

train:
  output:
    run_name: totalcapture_synthetic_imu_20260506_baseline
  epochs: 5
  batch_size: 64
  num_workers: 8
  compute_imu_stats: true
  imu_sensor: R_LowArm
  repeat_single_sensor: 4

test:
  output:
    run_name: totalcapture_synthetic_imu_20260506_baseline
  checkpoint: ""
  batch_size: 64
  metrics:
    frame_acc:
      enabled: true
    group_test:
      enabled: true
      group_sizes: "2,4,6,8,16"
      num_trials: 200
      chunk_windows: 30
      min_chunk_windows: 15
      seed: 42
