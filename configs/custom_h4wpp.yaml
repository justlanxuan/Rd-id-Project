project: custom_h4wpp

preprocess:
  dataset: custom
  raw_root: /data/fzliang/custom/2person
  output: /data/fzliang/reid-project/custom/preprocessed/h4wpp_w24/video_manifest.csv
  reuse_prepared: true
  prepared_root: /data/fzliang/reid-project/custom/preprocessed/h4wpp_w24
  imu:
    lowpass_cutoff_hz: 0.0

slice:
  window_len: 24
  stride: 16
  train_sessions: "20260211_171423,20260211_172522"
  val_sessions: "20260211_171724"
  test_sessions: "20260211_172257"
  multi_person: true
  skeleton_normalize: true

train:
  output:
    output_root: /data/fzliang/reid-project/custom/artifacts/train
    run_name: h4wpp_w24
  model:
    type: hybrid
    hybrid_skeleton_feature_mode: hybrid
    hybrid_imu_feature_mode: raw
  device: cuda
  epochs: 20
  batch_size: 64
  num_workers: 4
  compute_imu_stats: true
  imu_sensor: ""
  repeat_single_sensor: 1

test:
  output:
    output_root: /data/fzliang/reid-project/custom/artifacts/evaluate
    run_name: h4wpp_w24
  checkpoint: ""
  device: cuda
  batch_size: 64
  metrics:
    frame_acc:
      enabled: true
    group_test:
      enabled: true
      group_sizes: "2,4,6,8,16"
      num_trials: 100
      chunk_windows: 30
      min_chunk_windows: 15
      seed: 42
