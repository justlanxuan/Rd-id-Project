project: custom_full_session_totalcapture_pretrained

train:
  model:
    type: hybrid
  device: cuda

test:
  checkpoint: /data/fzliang/reid-project/g6/c9a5d3099979296a72314eba66274855e03ab1eb/artifacts/train/train__source__totalcapture__seed0/best.pt
  output:
    output_root: /data/fzliang/reid-project/custom/evaluation/full_session_tracklet_history
    run_name: totalcapture_pretrained_seed0_hard_threshold
  metrics:
    frame_acc:
      enabled: true
      mode: full_session
      session_root: /data/fzliang/reid-project/custom/preprocessed/custom_hybrid_finetune_from_egohumans/aligned_sequences
      tracklet_root: /data/fzliang/reid-project/custom/skeleton/alphapose
      tracklet_filename: skeleton_unmerged.json
      custom_imu_root: /data/fzliang/data/preprocess/2person
      custom_imu_raw_swap_sessions: ["20260211_171724", "20260211_172257"]
      sessions: ["20260211_171423", "20260211_171724", "20260211_172257", "20260211_172522"]
      window_size: 24
      stride: 16
      per_window_features: true
      normalize_extract_skeleton: true
      cosine_weight: 1.0
      pair_logit_weight: 0.0
      matcher: tracklet_history
      assigner: greedy
      history:
        decay: 0.0
        confidence_threshold: 0.7
        confidence_mode: sigmoid_margin
        confidence_scale: 3.0
        low_confidence_action: preserve
    group_test:
      enabled: false
