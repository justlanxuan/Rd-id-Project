# TotalCapture full training using Vicon GT
# S1-S5, 50 epochs

project: totalcapture_shuffle

preprocess:
  dataset: totalcapture
  raw_root: /data/fzliang/totalcapture
  camera: cam1

slice:
  window_len: 24
  stride: 16
  sensor_order: [L_LowLeg, R_LowLeg, L_LowArm, R_LowArm]
  train_subjects: S1,S2,S3
  val_subjects: S4
  test_subjects: S5
  max_sequences: 0

train:
  epochs: 200
  batch_size: 64
  num_workers: 8
  compute_imu_stats: true
  imu_sensor: R_LowArm
  repeat_single_sensor: 4
  shuffle_video_in_batch: true
  device: cuda:7

test:
  batch_size: 64
  metrics:
    frame_acc:
      enabled: true
    group_test:
      enabled: true
      group_sizes: "2,4,6,8,16"
      num_trials: 200
      chunk_windows: 30
      min_chunk_windows: 15
      seed: 42
