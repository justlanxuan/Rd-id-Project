# Custom dataset with optional Global Motion Encoder
# Usage:
#   python -m src.pipelines --config configs/custom_global.yaml --stages all
#
# To use global motion encoder, set train.model.use_global_motion: true
# To use baseline (no global motion), set train.model.use_global_motion: false

project: custom_global

preprocess:
  dataset: custom
  raw_root: /data/fzliang/custom
  skeleton_normalize: false

extract:
  detector: bytetrack
  tracker: bytetrack
  pose_estimator: alphapose
  skip_existing: true
  gpu: 0
  merge_tracklets:
    enabled: true
    max_gap: 10000000
    score_thresh: 2.2
    max_norm_dist: 2.8
    max_size_diff: 1.8
    fill_gaps: false
    known_num_people: 2

slice:
  window_len: 24
  stride: 16
  # All 4 sessions of custom dataset
  train_sessions: "20260211_171423,20260211_171724,20260211_172257"
  val_sessions: "20260211_172522"
  test_sessions: "20260211_172522"
  max_sequences: 0
  skeleton_normalize: true

train:
  output:
    run_name: custom_global_22test_20e
  model:
    motionbert_root: /home/fzliang/origin/MotionBERT
    motionbert_config: configs/pose3d/MB_ft_h36m_global_lite.yaml
    motionbert_ckpt: checkpoint/pretrain/MB_lite_models.bin
    imu_ckpt: /home/fzliang/despite/pretrained_models/v2/SIE_v2.pth

    # ------------------------------------------------------------------
    # Global Motion Encoder Configuration
    # ------------------------------------------------------------------
    # Set to true to enable global motion fusion (bbox center trajectory)
    use_global_motion: true

    # Input dimension: 2 for bbox center (cx, cy), 3 for 3D root
    global_motion_input_dim: 2

    # LSTM hidden dimension for global motion encoding
    global_motion_hidden_dim: 64

    # Number of LSTM layers
    global_motion_num_layers: 2

    # Dropout rate
    global_motion_dropout: 0.1

    # Input preprocessing: "raw", "diff", or "diff_raw"
    global_motion_input_type: diff_raw

    # Fusion type: "concat", "add", or "gated"
    global_motion_fusion_type: concat

    # Whether to project LSTM output to embed_dim via MLP
    global_motion_fusion_proj: true

    # Root trajectory source: "auto", "bbox_center", or "root_3d"
    global_motion_root_source: auto

  epochs: 20
  batch_size: 32
  num_workers: 4
  compute_imu_stats: true
  imu_sensor: R_LowArm
  repeat_single_sensor: 4

test:
  output:
    run_name: custom_global_22test_5e
  checkpoint: ""
  batch_size: 32
  matcher:
    dl_matcher:
      enabled: true
    physics_based_matcher:
      enabled: false
      evaluation_profile: single_sequence
      frequency:
        enabled: true
        fs_hz: 30
        n_fft: 64
        top_k: 8
        band_min_hz: 0.3
        band_max_hz: 8.0
        use_hann: true
        use_log1p: true
        normalize: l2
        threshold: 0.0
        imu_signal: acc_norm_mean
        skeleton_signal: pelvis_left_wrist_speed
  grouped_test:
    enabled: true
    group_sizes: "2,4,6,8,16"
    num_trials: 200
    chunk_windows: 30
    min_chunk_windows: 15
    seed: 42
  synchronous_test:
    enabled: true
    window_size: 24
    stride: 16
