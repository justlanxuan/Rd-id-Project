project: custom_complete


preprocess:
  imu:
    lowpass_cutoff_hz: 10.0
    lowpass_fs_hz: 100.0
  dataset: custom
  raw_root: /data/fzliang/custom
  skeleton_normalize: false

extract:
  detector: bytetrack
  tracker: bytetrack
  pose_estimator: alphapose
  skip_existing: true
  gpu: 0
  merge_tracklets:
    enabled: true
    max_gap: 10000000
    score_thresh: 2.2
    max_norm_dist: 2.8
    max_size_diff: 1.8
    fill_gaps: false
    known_num_people: 2

slice:
  window_len: 24
  stride: 16
  # Use session-level splits for custom dataset 20260211_171423,20260211_171724,20260211_172257,20260211_172522
  train_sessions: "20260211_171423,20260211_171724,20260211_172522"
  val_sessions: "20260211_172257"
  test_sessions: "20260211_172257"
  max_sequences: 0
  skeleton_normalize: true

train:
  output:
    run_name: custom_complete_without_filter_20
  epochs: 50
  batch_size: 64
  num_workers: 8
  compute_imu_stats: true
  imu_sensor: R_LowArm
  repeat_single_sensor: 4

test:
  output:
    run_name: custom_complete_without_filter_20
  checkpoint: ""
  batch_size: 64
  metrics:
    frame_acc:
      enabled: true
    group_test:
      enabled: true
      group_sizes: "2,4,6,8,16"
      num_trials: 200
      chunk_windows: 30
      min_chunk_windows: 15
      seed: 42
