project: egohumans

preprocess:
  dataset: totalcapture_synthetic
  imu_source: synthetic
  synthetic_imu_root: /home/fzliang/Autism-project/data/interim/egohumans_mobind/sequences_v2

slice:
  window_len: 24
  stride: 16
  train_sessions: "01_006,01_007,01_008,01_009,01_010,01_011,01_012,01_013,01_014,02_006,03_006,03_007,03_008,03_009,03_010"
  val_sessions: "01_005,02_005,03_005"
  test_sessions: "01_001,01_002,01_003,01_004,02_001,02_002,02_003,02_004,03_001,03_002,03_003,03_004"
  max_sequences: 0
  skeleton_source: vicon
  skeleton_normalize: true
  multi_person: true

train:
  output:
    run_name: egohumans
  model:
    motionbert_root: /home/fzliang/origin/MotionBERT
    motionbert_config: configs/pose3d/MB_ft_h36m_global_lite.yaml
    motionbert_ckpt: checkpoint/pretrain/MB_lite_models.bin
    imu_ckpt: /home/fzliang/despite/pretrained_models/v2/SIE_v2.pth
  epochs: 50
  batch_size: 32
  num_workers: 4
  compute_imu_stats: true
  imu_sensor: ""
  repeat_single_sensor: 1
  device: cuda:4
  freeze_backbone_epochs: 50

test:
  output:
    run_name: egohumans
  checkpoint: ""
  batch_size: 64
  grouped_test:
    enabled: true
    group_sizes: "2,4,6,8"
    num_trials: 200
    chunk_windows: 30
    min_chunk_windows: 15
    seed: 42
  synchronous_test:
    enabled: true
    window_size: 24
    stride: 16
