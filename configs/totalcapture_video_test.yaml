# TotalCapture video workflow quick test
# Small sample (1 video, S1 only, 2 epochs)

project: totalcapture_video_test

preprocess:
  dataset: totalcapture
  raw_root: /data/fzliang/totalcapture
  camera: cam1

extract:
  detector: bytetrack
  tracker: bytetrack
  pose_estimator: alphapose
  limit: 1
  skip_existing: true
  gpu: 0
  merge_tracklets:
    enabled: false
    max_gap: 10000000
    score_thresh: 2.2
    max_norm_dist: 2.8
    max_size_diff: 1.8
    fill_gaps: false
    known_num_people: 1

slice:
  window_len: 24
  stride: 16
  sensor_order: [L_LowLeg, R_LowLeg, L_LowArm, R_LowArm]
  train_subjects: S1
  val_subjects: S1
  test_subjects: S1
  max_sequences: 1

train:
  model:
    motionbert_root: /home/fzliang/origin/MotionBERT
    motionbert_config: configs/pose3d/MB_ft_h36m_global_lite.yaml
    motionbert_ckpt: checkpoint/pretrain/MB_lite_models.bin
    imu_ckpt: /home/fzliang/despite/pretrained_models/v2/SIE_v2.pth
  epochs: 2
  batch_size: 32
  num_workers: 4
  compute_imu_stats: true
  imu_sensor: R_LowArm
  repeat_single_sensor: 4

test:
  output:
    run_name: totalcapture_video_test_physics
  batch_size: 32
  matcher:
    dl_matcher:
      enabled: false
    physics_based_matcher:
      enabled: true
      iou_threshold: 0.5
      frequency:
        enabled: true
        fs_hz: 30
        n_fft: 64
        top_k: 8
        band_min_hz: 0.3
        band_max_hz: 8.0
        use_hann: true
        use_log1p: true
        normalize: l2
        threshold: 0.0
        imu_signal: acc_norm_mean
        skeleton_signal: left_wrist_speed
  grouped_test:
    enabled: false
    group_sizes: "2,4,6,8,16"
    num_trials: 50
    chunk_windows: 30
    min_chunk_windows: 15
    seed: 42
  synchronous_test:
    enabled: false
    window_size: 24
    stride: 1