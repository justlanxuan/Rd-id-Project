name: cross_dataset_transfer_sota

description: >
  Strict one-session-out custom transfer benchmark. The source model is trained
  from scratch on EgoHumans realistic IMU, then fine-tuned on each custom fold.

expected:
  primary_metric: segment_frame_acc
  mean: 0.6550
  std: 0.1823
  runs: 24
  control:
    name: label_shuffle
    mean: 0.4628
    std: 0.1429

runner:
  output_root: /data/fzliang/reid-project/benchmarks/cross_dataset_transfer_sota_e21_compat
  default_action: run_all
  devices: [cuda:4, cuda:5, cuda:6, cuda:7]
  max_parallel: 4
  include_controls: true
  skip_existing: true
  seeds: [0, 1, 2, 3, 42, 123]
  folds:
    - {name: fold1_20260211_171423, session: "20260211_171423"}
    - {name: fold2_20260211_171724, session: "20260211_171724"}
    - {name: fold3_20260211_172257, session: "20260211_172257"}
    - {name: fold4_20260211_172522, session: "20260211_172522"}

data:
  source_root: /data/fzliang/reid-project/egohumans/preprocessed/e21_source_cache_compat
  target_folds_root: /data/fzliang/reid-project/custom/preprocessed/e21_cache_compat
  target_segment_root: /data/fzliang/reid_project/interim/custom_segments/sequences
  target_raw_imu_root: /data/fzliang/reid_project/interim/custom_extracted_data

prepare:
  source:
    enabled: true
    skip_existing: true
    preprocess_output_root: /data/fzliang/reid-project/egohumans/preprocessed/e21_source_cache_compat
    preprocess:
      output_format: unified_sequence_npz_and_window_csv
      raw_root: /data/lyxie/ReID/Data/egohumans
      extracted_root: /data/lyxie/ReID_imu_generation/outputs/egohumans_imu_realistic/extracted_data
      imu_source: realistic
      output: /data/fzliang/reid-project/egohumans/preprocessed/e21_source_cache_compat/video_manifest.csv
    slice:
      root: /data/fzliang/reid-project/egohumans/preprocessed/e21_source_cache_compat
      out_dir: /data/fzliang/reid-project/egohumans/preprocessed/e21_source_cache_compat
      window_len: 100
      stride: 40
      split_policy: mobind_e21_source
      skeleton_source: vicon
      skeleton_normalize: false
      multi_person: true
  target:
    enabled: true
    skip_existing: true
    preprocess:
      mode: raw_video_imu_annotations
      output_format: unified_sequence_npz_and_video_manifest
      raw_root: /data/fzliang/custom
      output: /data/fzliang/reid_project/interim/custom_preprocess/video_manifest.csv
      imu:
        lowpass_cutoff_hz: 10.0
        lowpass_fs_hz: 100.0
    extract:
      detector: bytetrack
      tracker: bytetrack
      pose_estimator: alphapose
      manifest_csv: /data/fzliang/reid_project/interim/custom_preprocess/video_manifest.csv
      results_root: /data/fzliang/reid_project/interim/custom_skeleton
      skip_existing: true
      gpu: 0
      merge_tracklets:
        enabled: true
        max_gap: 10000000
        score_thresh: 2.2
        max_norm_dist: 2.8
        max_size_diff: 1.8
        fill_gaps: false
        known_num_people: 2
    segments:
      output_format: custom_segment_npz_with_extract_skeleton
      input_root: /data/fzliang/reid_project/interim/custom_preprocess
      skeleton_root: /data/fzliang/reid_project/interim/custom_skeleton
      output_root: /data/fzliang/reid_project/interim/custom_segments
      normalize_extract_skeleton: true
      skip_existing: true
    slice:
      output_format: session_out_fold_window_cache
      window_len: 100
      stride: 16
      custom_imu_root: /data/fzliang/reid_project/interim/custom_extracted_data
      force: false
      split_policy: leave_one_session_out_20260211

source_train:
  epochs: 100
  batch_size: 128
  num_workers: 4
  lr_heads: 5e-4
  weight_decay: 1e-3
  max_grad_norm: 5.0
  temperature: 0.07
  learn_temperature: true
  early_stop_patience: 25
  early_stop_min_delta: 0.0001
  model:
    type: hybrid
    hybrid_hidden: 128
    hybrid_skeleton_smooth: 9
    hybrid_imu_smooth: 5

target_train:
  epochs: 120
  batch_size: 64
  num_workers: 0
  lr_heads: 2e-4
  weight_decay: 1e-3
  max_grad_norm: 5.0
  temperature: 0.07
  learn_temperature: true
  pair_loss_weight: 0.0
  pair_loss_target: pair
  group_batch_by_window: false
  early_stop_patience: 30
  early_stop_min_delta: 0.0001
  model:
    type: hybrid
    hybrid_hidden: 128
    hybrid_skeleton_smooth: 9
    hybrid_imu_smooth: 5

evaluation:
  batch_size: 64
  num_workers: 0
  frame_acc:
    window_size: 100
    stride: 16
    per_window_features: false
    shuffle_match: true
    seed: 42
    custom_imu_split_mode: test
    custom_imu_raw_swap_sessions: []

controls:
  label_shuffle:
    enabled: true
    shuffle_train: true
    shuffle_val: false
