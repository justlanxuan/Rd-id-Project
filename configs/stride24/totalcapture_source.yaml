project: stride24_totalcapture_source

preprocess:
  dataset: totalcapture
  reuse_prepared: true
  prepared_root: /data/fzliang/reid-project/totalcapture/preprocessed/stride24_w24

slice:
  window_len: 24
  stride: 24
  train_subjects: S1,S2,S3
  val_subjects: S4
  test_subjects: S5
  skeleton_source: vicon
  frame_acc_candidate_group_size: 4
  require_multi_candidate_test: true

train:
  model: {type: hybrid}
  epochs: 50
  batch_size: 64
  num_workers: 8
  compute_imu_stats: true
  imu_sensor: ""
  repeat_single_sensor: 1
  device: cuda
  seed: 0
  output: {run_name: stride24_totalcapture_source_seed0}

test:
  batch_size: 64
  metrics:
    frame_acc:
      enabled: true
      singleton_policy: error
      seed: 42
      shuffle_match: true
    group_test: {enabled: false}
