project: egohumans_test

preprocess:
  dataset: egohumans
  raw_root: /data/lyxie/ReID/Data/egohumans
  imu_source: realistic
  extracted_root: /data/lyxie/ReID_imu_generation/outputs/egohumans_imu_realistic/extracted_data

slice:
  window_len: 24
  stride: 16
  train_sessions: "01_005,01_006,01_007,01_008,01_009,01_010,01_011,02_001,02_002"
  val_sessions: "01_004"
  test_sessions: "01_001,01_002,01_003"
  max_sequences: 0
  skeleton_source: vicon
  skeleton_normalize: true
  multi_person: true

train:
  output:
    run_name: egohumans_test
  model:
    type: hybrid
  epochs: 20
  batch_size: 32
  num_workers: 4
  device: cuda:4
  compute_imu_stats: true
  imu_sensor: ""
  repeat_single_sensor: 1
  freeze_backbone_epochs: 20

test:
  output:
    run_name: egohumans_test
  checkpoint: ""
  batch_size: 32
  metrics:
    frame_acc:
      enabled: true
      seed: 42
      shuffle_match: true
    group_test:
      enabled: true
      group_sizes: "2,4"
      num_trials: 200
      chunk_windows: 30
      min_chunk_windows: 15
      seed: 42
      shuffle_match: true
      per_subject_split: false
