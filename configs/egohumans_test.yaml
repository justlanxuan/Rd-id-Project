project: egohumans_test

preprocess:
  dataset: totalcapture_synthetic
  imu_source: synthetic
  synthetic_imu_root: /home/fzliang/Autism-project/data/interim/egohumans_mobind/sequences_v2

slice:
  window_len: 24
  stride: 16
  train_sessions: "01_005,01_006,01_007,01_008,01_009,01_010,01_011,02_001,02_002"
  val_sessions: "01_004"
  test_sessions: "01_001,01_002,01_003"
  max_sequences: 0
  skeleton_source: vicon
  skeleton_normalize: true
  multi_person: true

train:
  output:
    run_name: egohumans_test
  model:
    motionbert_root: /home/fzliang/origin/MotionBERT
    motionbert_config: configs/pose3d/MB_ft_h36m_global_lite.yaml
    motionbert_ckpt: checkpoint/pretrain/MB_lite_models.bin
    imu_ckpt: /home/fzliang/despite/pretrained_models/v2/SIE_v2.pth
  epochs: 20
  batch_size: 32
  num_workers: 4
  device: cuda:4
  compute_imu_stats: true
  imu_sensor: ""
  repeat_single_sensor: 1
  freeze_backbone_epochs: 20

test:
  output:
    run_name: egohumans_test
  checkpoint: ""
  batch_size: 32
  grouped_test:
    enabled: true
    group_sizes: "2,4"
    num_trials: 200
    chunk_windows: 30
    min_chunk_windows: 15
    seed: 42
  synchronous_test:
    enabled: true
    window_size: 24
    stride: 16
