project: g6_totalcapture_source

preprocess:
  dataset: totalcapture
  raw_root: /data/fzliang/totalcapture
  camera: cam1
  imu:
    output_format: 7d
    sensor: L_LowArm

slice:
  window_len: 24
  stride: 16
  sensor_order: [L_LowLeg, R_LowLeg, L_LowArm, R_LowArm]
  train_subjects: S1,S2,S3
  val_subjects: S4
  test_subjects: S5
  max_sequences: 0
  skeleton_source: vicon
  skeleton_normalize: true
  frame_acc_candidate_group_size: 4
  require_multi_candidate_test: true

train:
  model:
    type: hybrid
  epochs: 50
  batch_size: 64
  num_workers: 8
  compute_imu_stats: true
  imu_sensor: ""
  repeat_single_sensor: 1
  device: cuda
  seed: 0
  output:
    run_name: g6_totalcapture_source_seed0

test:
  batch_size: 64
  metrics:
    frame_acc:
      enabled: true
      singleton_policy: error
      seed: 42
      shuffle_match: true
    group_test:
      enabled: true
      group_sizes: "2,4,6,8"
      num_trials: 200
      chunk_windows: 30
      min_chunk_windows: 15
      seed: 42
