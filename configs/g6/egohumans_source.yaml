project: g6_egohumans_source

preprocess:
  dataset: egohumans
  raw_root: /data/lyxie/ReID/Data/egohumans/data
  extracted_root: /data/lyxie/ReID_imu_generation/outputs/egohumans_imu_realistic/extracted_data
  imu:
    output_format: 7d
    sensor: LeftWrist

slice:
  window_len: 24
  stride: 16
  train_sessions: "01_006,01_007,01_008,01_009,01_010,01_011,01_012,01_013,01_014,02_006,03_006,03_007,03_008,03_009,03_010"
  val_sessions: "01_005,02_005,03_005"
  test_sessions: "01_001,01_002,01_003,01_004,02_001,02_002,02_003,02_004,03_001,03_002,03_003,03_004"
  max_sequences: 0
  skeleton_source: vicon
  skeleton_normalize: false
  multi_person: true
  require_multi_candidate_test: true

train:
  model:
    type: hybrid
  epochs: 50
  batch_size: 32
  num_workers: 4
  compute_imu_stats: true
  imu_sensor: ""
  repeat_single_sensor: 1
  device: cuda
  seed: 0
  output:
    run_name: g6_egohumans_source_seed0

test:
  batch_size: 64
  metrics:
    frame_acc:
      enabled: true
      singleton_policy: error
      seed: 42
      shuffle_match: true
    group_test:
      enabled: true
      group_sizes: "2,4,6,8"
      num_trials: 200
      chunk_windows: 30
      min_chunk_windows: 15
      seed: 42
