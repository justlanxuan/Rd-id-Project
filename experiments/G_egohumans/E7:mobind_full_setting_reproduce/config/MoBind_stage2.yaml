# ========== Experiment identity ==========
experiment:
  name: "mae"
  seed: 1201
  output_dir: "./outputs/EgoHumans/stage2_E7_repro"
  precision: "amp"

# ==========  Logging ==========
wandb:
  enabled: false
  project: "MoBind"
  config:
    experiment: ${experiment}
    data: ${data}
    model: ${model}
    optimizer: ${optimizer}
    training: ${training}
    distributed: ${distributed}

# ==========  Data ==========
# Set model.stage1_exp to the directory of your trained Stage 1 checkpoint
data:
  root_dir: "/data/lyxie/ReID/Data/egohumans/EgoHumans"
  window_sec: 5
  stride_sec: 2
  split: action
  imu_srate: 20
  motion_srate: 20
  motion_type: "wjoint"
  multi_sensor: true
  num_limbs: 5
  dataset_name: EgoHumans
  drop_sensors: false

  loader:
    batch_size: 128
    num_workers: 8
    pin_memory: true


# ==========  Model ==========
model:
  stage1_exp: "/home/fzliang/MoBind/outputs/EgoHumans/stage1_E7_repro/EgoHumans/06-25-2026:23:13:37"
  imu_encoder: "conv_former"
  imu_channels: 7
  motion_encoder: "conv_former"
  motion_channels: 6
  num_blocks: 4
  num_heads: 8
  patch_sec: 0.2
  embedding_size: 256
  global_embedding_size: 256
  agg: null
  lambda_mae: 0.3
  mask_ratio: 0.75

# ==========  Optimiser ==========
optimizer:
  opt: "adam"
  lr: 1e-4
  weight_decay: 1e-4

# ==========  Training loop ==========
training:
  epochs: 10000
  log_interval: 25
  val_interval: 1
  local_weight: 0.0
  multi_weight: 0.2
  global_weight: 1.0
  early_stopping:
    patience: 500
    min_delta: 0.001
    mode: "max"

# ==========  Hardware / distributed ==========
distributed:
  backend: "nccl"
  gpus: [0]
